<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCEAN GAIA V3.2 — 엔진 플레이 시뮬레이터 (세션 B)</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; background: #04101c; color: #dceaf7; min-height: 100vh; }
      header { padding: 14px 20px; background: linear-gradient(90deg,#06263f,#0a3b5c); border-bottom: 1px solid #144e75; display:flex; align-items:center; gap:12px; }
      header h1 { font-size: 18px; letter-spacing: 1px; }
      header .badge { font-size: 11px; background:#0e5c8a; padding:2px 8px; border-radius:10px; }
      main { display: grid; grid-template-columns: 300px 1fr 340px; gap: 12px; padding: 12px; height: calc(100vh - 60px); }
      .panel { background: rgba(10,40,66,.75); border:1px solid #14496e; border-radius:12px; padding:14px; overflow-y:auto; backdrop-filter: blur(6px); }
      .panel h2 { font-size: 13px; color:#7fc6ee; margin-bottom:10px; letter-spacing:1px; }
      button { background:#0e5c8a; color:#fff; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:13px; margin:2px; }
      button:hover { background:#1273ab; }
      button.warn { background:#8a3b0e; } button.ok2 { background:#0e8a5c; }
      input[type=range] { width: 100%; }
      .kv { display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; border-bottom:1px dashed #123c58; }
      .kv b { color:#9fd6f5; font-weight:600; }
      #log { font-size:11.5px; line-height:1.5; max-height:210px; overflow-y:auto; background:#031019; border-radius:8px; padding:8px; }
      #catchList > div { display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:5px 6px; border-bottom:1px solid #0f3450; }
      #worldCanvas { width:100%; height:230px; background:#02090f; border-radius:10px; border:1px solid #123c58; }
      .hint { font-size:11px; color:#6d93ad; margin-top:6px; }
      .tag { font-size:10px; padding:1px 6px; border-radius:8px; background:#134b70; }
      .tag.rare { background:#6b2d70; } .tag.prot { background:#702d2d; }
    </style>
  </head>
  <body>
    <header>
      <h1>🌊 OCEAN GAIA V3.2</h1>
      <span class="badge">세션 B 엔진 · 실제 규칙 동작 검증용 시뮬레이터</span>
      <span class="badge" id="fps"></span>
    </header>
    <main>
      <section class="panel">
        <h2>조작 (WASD + 단축키)</h2>
        <div class="kv"><span>출항/정박</span><b>U / K</b></div>
        <div class="kv"><span>입수/귀선</span><b>E / Q</b></div>
        <div class="kv"><span>포획(가장 가까운 개체)</span><b>Space</b></div>
        <div class="kv"><span>관찰</span><b>F</b></div>
        <div class="kv"><span>판매(정박 시)</span><b>V</b></div>
        <div class="kv"><span>시간 배속</span><b>T (×1→×60→×600)</b></div>
        <canvas id="worldCanvas"></canvas>
        <div class="hint">위: 해역지도 (배=흰 삼각형, 다이버=노점, 물고기=점). 색상은 해역별 수심 대표색.</div>
        <h2 style="margin-top:14px">상태</h2>
        <div id="status"></div>
      </section>

      <section class="panel">
        <h2>주변 개체 (nearby 120m) — 클릭 시 접근 후 포획 시도</h2>
        <div id="catchList"></div>
        <h2 style="margin-top:14px">도감 하이라이트</h2>
        <div id="codexTop"></div>
        <h2 style="margin-top:14px">이벤트 로그</h2>
        <div id="log"></div>
      </section>

      <section class="panel">
        <h2>경제·장비</h2>
        <div id="shop"></div>
        <h2 style="margin-top:14px">저장</h2>
        <button id="btnSave">💾 저장</button>
        <button id="btnLoad">📂 불러오기</button>
        <button id="btnReset" class="warn">초기화</button>
        <div class="hint" id="saveInfo"></div>
        <h2 style="margin-top:14px">날씨·시간</h2>
        <div id="env"></div>
      </section>
    </main>
    <script type="module">
      import { createGame } from '/src/core/GameEngine.js';
      import { SPEARS, TANKS, SUITS, SHIP_UPGRADES } from '/src/data/equipment.js';
      import { buildSpecies } from '/src/data/species.js';

      const species = buildSpecies();
      const byId = new Map(species.map(s => [s.id, s]));
      // 브라우저 localStorage 어댑터 (save/load 영속화)
      const game = createGame({ seed: 12345, storage: {
        getItem: k => localStorage.getItem(k),
        setItem: (k, v) => localStorage.setItem(k, v),
        removeItem: k => localStorage.removeItem(k),
      }});

      let timeScale = 1;
      const keys = {};
      addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        const k = e.key.toLowerCase();
        if (k === 'u') { game._state.ship.docked = false; log('출항!'); }
        if (k === 'k') { const r = game.dispatch({ type: 'DOCK' }); log(r.ok ? '정박 완료' : '실패: ' + r.reason); }
        if (k === 'e') { const r = game.dispatch({ type: 'ENTER_WATER' }); log(r.ok ? '입수 (E)' : '실패: ' + r.reason); }
        if (k === 'q') { const r = game.dispatch({ type: 'RETURN_TO_SHIP' }); log(r.ok ? '귀선 (Q)' : '실패: ' + r.reason); }
        if (k === ' ') { tryCatchNearest(); e.preventDefault(); }
        if (k === 'f') observeNearest();
        if (k === 'v') { const r = game.dispatch({ type: 'SELL_ALL' }); log(r.ok ? `판매 +${r.gained} 조개` : '실패: ' + r.reason); }
        if (k === 't') { timeScale = timeScale === 1 ? 60 : timeScale === 60 ? 600 : 1; log('시간 배속 ×' + timeScale); }
      });
      addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

      function nearest() {
        const dv = game._state.diver, sh = game._state.ship;
        const x = dv.inWater ? dv.x : sh.x, z = dv.inWater ? dv.z : sh.z, y = dv.inWater ? dv.y : 0;
        return game.nearby(x, z, y, 400, { sort: 'distance', limit: 1 })[0];
      }
      function tryCatchNearest() {
        if (!game._state.diver.inWater) { log('포획 실패: 잠수 중이 아닙니다 (E로 입수)'); return; }
        const t = nearest();
        if (!t) { log('포획 실패: 근처에 개체가 없습니다'); return; }
        const dv = game._state.diver;
        dv.x = t.x; dv.z = t.z; dv.y = t.y; dv.depthM = Math.abs(t.y); // 자동 접근(디버그)
        const r = game.dispatch({ type: 'CATCH_ATTEMPT', specimenId: t.specimenId, distanceM: Math.min(5, t.distanceM) });
        const sp = byId.get(t.speciesId);
        log(r.ok ? `🎯 ${sp.nameKo} 포획! ${t.lengthCm}cm / ${t.weightKg}kg` : `✗ ${sp.nameKo}: ${r.reason}`);
      }
      function observeNearest() {
        const t = nearest();
        if (!t) { log('관찰 실패: 근처에 개체가 없습니다'); return; }
        const r = game.dispatch({ type: 'OBSERVE_CREATURE', specimenId: t.specimenId });
        const sp = byId.get(t.speciesId);
        log(r.ok ? `👁 ${sp.nameKo} 관찰${r.first ? ` (+${r.reward} 조개)` : ''}` : '실패: ' + r.reason);
      }

      const $ = id => document.getElementById(id);
      function log(msg) {
        const el = $('log');
        const snap = game.getSnapshot();
        el.innerHTML = `<div>[${fmtTime(snap.timeSec)}] ${msg}</div>` + el.innerHTML;
        if (el.children.length > 60) el.removeChild(el.lastChild);
      }
      function fmtTime(sec) {
        const h = Math.floor(sec / 3600) % 24, m = Math.floor(sec / 60) % 60;
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      }

      // 지도 렌더
      const cv = $('worldCanvas'), ctx = cv.getContext('2d');
      const ZONE_COLORS = { tropical:'#0a5c6e', mangrove:'#3d5c2a', glacier:'#274b63', volcanic:'#5c2a2a', open_ocean:'#123a66', deep_sea:'#0a1e40' };
      function drawMap(snap) {
        cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio;
        ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
        const W = cv.clientWidth, H = cv.clientHeight, sx = W/4800, sy = H/3200;
        ctx.clearRect(0,0,W,H);
        for (const [k,b] of Object.entries({ tropical:[400,1400,1800,2600], mangrove:[1800,1400,2800,2600], glacier:[400,200,1800,1400], volcanic:[2800,200,4400,1400], open_ocean:[1800,200,2800,1400], deep_sea:[2800,1400,4400,2600] })) {
          ctx.fillStyle = ZONE_COLORS[k]; ctx.fillRect(b[0]*sx, b[1]*sy, (b[2]-b[0])*sx, (b[3]-b[1])*sy);
        }
        for (const s of snap.specimens) { ctx.fillStyle = '#9fe0ff'; ctx.fillRect(s.x*sx-1, s.z*sy-1, 2, 2); }
        ctx.fillStyle = '#ffd27f';
        for (const isl of [[755,1780],[1200,2200],[900,1600],[1500,2400],[2100,2100],[2500,1800],[800,900],[1300,500],[3400,900],[4000,500],[2300,900],[3600,2200]]) {
          ctx.beginPath(); ctx.arc(isl[0]*sx, isl[1]*sy, 3, 0, 7); ctx.fill();
        }
        const sh = snap.ship;
        ctx.save(); ctx.translate(sh.x*sx, sh.z*sy); ctx.rotate(-sh.headingRad);
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(4,5); ctx.lineTo(-4,5); ctx.closePath(); ctx.fill(); ctx.restore();
        if (snap.diver.inWater) { ctx.fillStyle='#ffe14d'; ctx.beginPath(); ctx.arc(snap.diver.x*sx, snap.diver.z*sy, 3, 0, 7); ctx.fill(); }
      }

      function renderShop(snap) {
        const owned = [...snap.equipment.ownedSpears, ...snap.equipment.ownedTanks, ...snap.equipment.ownedSuits];
        let html = '';
        const row = (kind, it) => {
          const has = owned.includes(it.id);
          const eq = snap.equipment['equipped'+({spear:'Spear',tank:'Tank',suit:'Suit'})[kind]] === it.id;
          html += `<div class="kv"><span>${it.name} <small>${it.price}조개</small></span>
            <span>${has ? (eq ? '<b>장착중</b>' : `<button data-kind="${kind}" data-id="${it.id}" class="eqBtn">장착</button>`) : `<button data-kind="${kind}" data-id="${it.id}" data-buy="1" class="buyBtn">구매</button>`}</span></div>`;
        };
        html += '<h2>작살</h2>'; SPEARS.slice(0,8).forEach(s => row('spear', s));
        html += '<h2>산소통</h2>'; TANKS.forEach(t => row('tank', t));
        html += '<h2>잠수복</h2>'; SUITS.forEach(t => row('suit', t));
        html += `<h2>선박 개조</h2><div class="kv"><span>${snap.shipStats.name} (Lv${snap.ship.level})</span>
          <button id="upgBtn" class="ok2">${snap.ship.level<5 ? '개조 '+SHIP_UPGRADES[snap.ship.level].unlock?.shells+'조개' : '최대'}</button></div>`;
        $('shop').innerHTML = html;
        document.querySelectorAll('.buyBtn').forEach(b => b.onclick = () => {
          const r = game.dispatch({ type: 'BUY_ITEM', kind: b.dataset.kind, itemId: b.dataset.id });
          log(r.ok ? '구매 성공' : '구매 실패: ' + r.reason);
        });
        document.querySelectorAll('.eqBtn').forEach(b => b.onclick = () => {
          const r = game.dispatch({ type: 'EQUIP_ITEM', kind: b.dataset.kind, itemId: b.dataset.id });
          log(r.ok ? '장착 완료' : '실패: ' + r.reason);
        });
        const up = $('upgBtn'); if (up) up.onclick = () => {
          const r = game.dispatch({ type: 'UPGRADE_SHIP' }); log(r.ok ? `선박 Lv${r.level} 개조!` : '실패: ' + r.reason);
        };
      }

      let lastShopSig = '';
      function render(snap) {
        const st = $('status');
        st.innerHTML = [
          ['좌표', `(${Math.round(snap.ship.x)}, ${Math.round(snap.ship.z)}) ${snap.currentZone}`],
          ['속도', snap.ship.speedMs.toFixed(1)+' m/s'],
          ['정박', snap.ship.docked ? '✅' : '❌ 항해중'],
          ['다이버', snap.diver.inWater ? `수심 ${snap.diver.depthM.toFixed(1)}m` : '선상'],
          ['공기', `${Math.round(snap.diver.air)}/${snap.diver.maxAir}`],
          ['조개', '🐚 ' + snap.shells],
          ['창고', `${snap.holdUsedKg.toFixed(1)}/${snap.holdCapacityKg} kg (${snap.inventoryCount}개)`],
          ['최대 수심 기록', snap.maxDepthReachedM.toFixed(0)+'m'],
        ].map(([k,v]) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('');

        $('env').innerHTML = [
          ['날짜', `Day ${snap.day} (${snap.season})`],
          ['시각', fmtTime(snap.timeSec) + (snap.isNight ? ' 🌙' : ' ☀️')],
          ['날씨', snap.weather],
          ['배속', '×'+timeScale],
        ].map(([k,v]) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('');

        const list = game.nearby(snap.diver.inWater?snap.diver.x:snap.ship.x, snap.diver.inWater?snap.diver.z:snap.ship.z, snap.diver.inWater?snap.diver.y:0, 120, { sort:'distance', limit:12 });
        $('catchList').innerHTML = list.map(n => {
          const sp = byId.get(n.speciesId);
          return `<div><span>${sp.nameKo} <span class="tag ${sp.protected?'prot':''}">${sp.protected?'보호종':'R'+sp.rarity}</span>
            <small>${n.lengthCm}cm/${n.weightKg}kg · ${n.distanceM}m · ${n.behavior}</small></span>
            <button data-sid="${n.specimenId}">포획</button></div>`;
        }).join('') || '<div class="hint">근처 120m 내 개체 없음 — W/S/A/D로 이동하세요.</div>';
        document.querySelectorAll('#catchList button').forEach(b => b.onclick = () => {
          if (!game._state.diver.inWater) { log('먼저 E로 입수하세요.'); return; }
          const t = game._state.specimens.find(s => s.specimenId === b.dataset.sid);
          if (!t) return;
          const dv = game._state.diver; dv.x=t.x; dv.z=t.z; dv.y=t.y; dv.depthM=Math.abs(t.y);
          const r = game.dispatch({ type:'CATCH_ATTEMPT', specimenId:t.specimenId, distanceM:4 });
          const sp = byId.get(t.speciesId);
          log(r.ok ? `🎯 ${sp.nameKo} 포획!` : `✗ ${r.reason}`);
        });

        const codexEntries = Object.entries(snap.codex).filter(([,e])=>e.catchCount>0||e.observeCount>0)
          .sort((a,b)=>(b[1].longestCm-a[1].longestCm)).slice(0,8);
        $('codexTop').innerHTML = codexEntries.map(([id,e]) => {
          const sp = byId.get(+id);
          return `<div class="kv"><span>${sp.nameKo}</span><b>${e.longestCm}cm · 포획${e.catchCount} · 관찰${e.observeCount}</b></div>`;
        }).join('') || '<div class="hint">아직 기록 없음</div>';

        const sig = snap.shells + '|' + snap.ship.level + '|' + JSON.stringify(snap.equipment.ownedSpears)+JSON.stringify(snap.equipment.ownedTanks)+JSON.stringify(snap.equipment.ownedSuits);
        if (sig !== lastShopSig) { lastShopSig = sig; renderShop(snap); }
        drawMap(snap);
      }

      $('btnSave').onclick = () => { const r = game.save(); log(r.ok ? '저장 완료' : '실패'); $('saveInfo').textContent = r.ok ? `게임내 시각 ${fmtTime(game.getSnapshot().timeSec)}` : ''; };
      $('btnLoad').onclick = () => { const r = game.load(); log(r.ok ? '불러오기 완료' : '실패: ' + r.reason); };
      $('btnReset').onclick = () => { localStorage.removeItem('oceangaia.save'); location.reload(); };

      // 게임 루프
      let last = performance.now(), frames = 0, fpsT = last;
      function loop(now) {
        const realDt = Math.min(0.1, (now - last) / 1000); last = now;
        const dt = realDt * timeScale;
        // 조작 → dispatch
        const fwd = (keys['w']?1:0) - (keys['s']?1:0);
        const turn = (keys['a']?-1:0) + (keys['d']?1:0);
        if (game._state.diver.inWater) {
          const dz = (keys['w']?-1:0)+(keys['s']?1:0), dx=(keys['a']?-1:0)+(keys['d']?1:0);
          const dy = (keys['r']?-1:0)+(keys['f']?0:0);
          if (dx||dz) game.dispatch({ type:'MOVE_DIVER', dx, dz, dy:0, dtSec: Math.min(1,dt) });
        } else if (fwd || turn) {
          game.dispatch(fromA(fwd, turn, dt));
        }
        game.dispatch({ type: 'TICK', dtSec: dt });
        render(game.getSnapshot());
        frames++; if (now - fpsT > 1000) { $('fps').textContent = frames + ' FPS'; frames = 0; fpsT = now; }
        requestAnimationFrame(loop);
      }
      function fromA(fwd, turn, dt) { return { type:'MOVE_SHIP', forward: fwd, turn, dtSec: Math.min(1, dt) }; }
      log('시뮬레이터 시작 — U(출항) → W/S/A/D(항해) → E(입수) → Space(포획) → Q(귀선) → K(정박) → V(판매)');
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
